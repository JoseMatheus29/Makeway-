[package]
name = "nucleo"
version.workspace = true
edition.workspace = true

[dependencies]
blake3 = "1.8.7"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
ntapi = "0.4.3"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
trash = "5.3.0"
windows = { version = "0.62.2", features = ["Win32_System_SystemInformation", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Power", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_Registry", "Win32_System_Time", "Win32_Foundation", "Win32_System_Console"] }
winreg = "0.56.0"
